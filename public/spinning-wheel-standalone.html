<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

  <!-- ===== PRECONNECT — PageSpeed optimization ===== -->
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
  <!-- ===== END PRECONNECT ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- ========== КРИТИЧНО: ROBOTS META ========== -->
    <meta name="robots" content="noindex, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="googlebot" content="noindex, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://code.jquery.com https://stackpath.bootstrapcdn.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://stackpath.bootstrapcdn.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.telegram.org https://*.supabase.co https://*.vercel.app; object-src 'none'; media-src 'self'; frame-src 'self' https://plusrent.md; base-uri 'self'; form-action 'self';">
    <title>Premium Spinning Wheel</title>
    <script src="js/config.min.js?v=a63faff7"></script>
    <script src="js/i18n-init.min.js?v=5eea9efe"></script>
    <link rel="stylesheet" href="/css/fonts.css?v=202609187">
    <link rel="stylesheet" href="/css/spin-wheel-frame.min.css?v=59e1a608">
</head>
<body>
    <div class="swf" id="swf">
        <div class="swf-stage">
            <div class="swf-wheel-wrap">
                <svg class="swf-rim" id="swfRim" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
                <div class="wheel" id="wheel" role="img" aria-label="Wheel"></div>
                <div class="swf-pointer" aria-hidden="true">
                    <svg viewBox="0 0 30 40"><path d="M15 39 3.2 14.5A12.5 12.5 0 1 1 26.8 14.5Z" fill="#f59e0b" stroke="#1c1917" stroke-width="2.5" stroke-linejoin="round"/><circle cx="15" cy="12.5" r="4.2" fill="#1c1917"/></svg>
                </div>
                <button type="button" class="swf-hub" id="centerButton" disabled>
                    <span class="center-icon">START</span>
                </button>
            </div>
        </div>

        <div class="swf-status" aria-live="polite">
            <p class="swf-hint" id="swfHint"></p>

            <div class="result-card" id="resultCard">
                <p class="swf-congrats" id="congratulationsText"></p>
                <p class="swf-won" id="youWonText"></p>
                <div class="swf-prize">
                    <span class="prize-display" id="prizeDisplay"></span>
                    <span class="swf-prize-unit" id="prizeUnit"></span>
                </div>
                <div class="swf-ticket">
                    <div class="swf-ticket-text">
                        <span class="swf-ticket-label" id="useCodeText"></span>
                        <span class="discount-code is-pending" id="discountCode">&middot; &middot; &middot;</span>
                    </div>
                    <button type="button" class="swf-copy" id="copyCode" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
                <button type="button" class="book-now-button" id="bookNowButton">
                    <span id="bookNowText"></span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="js/spin-wheel-frame.min.js?v=0cc3b7c4"></script>
</body>
</html>
